<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:transparent; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; justify-content:flex-end; height:100vh; overflow:hidden; }
  #strip { height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    position:relative; width:100%; max-width:64px; margin-left:auto;
    background:#2b2c33; border:1px solid #41424d; border-radius:7px; }
  #strip:hover { border-color:#8a5cff; }
  #strip svg { width:18px; height:18px; stroke:#8a5cff; fill:none; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round; }
  #dot { position:absolute; top:4px; right:5px; width:7px; height:7px; border-radius:50%;
    background:#2fbf8f; display:none; }
  #dot.on { display:block; }
  #panel { display:none; background:#1e1f24; border:1px solid #3a3b45; border-radius:10px;
    margin:0 4px 6px; padding:12px 14px; color:#d5d6de; font-size:12px; width:340px; }
  #panel.open { display:block; }
  .hd { display:flex; align-items:center; margin-bottom:8px; font-size:11px; color:#6a6b76; }
  .hd b { color:#d5d6de; font-weight:500; }
  .hd .sp { flex:1; }
  .mini { height:22px; padding:0 9px; border:1px solid #3a3b45; border-radius:5px; background:#141519;
    color:#9a9ba6; font-size:10.5px; cursor:pointer; }
  .mini:hover { color:#fff; border-color:#8a5cff; }
  .frm { display:flex; flex-direction:column; gap:6px; padding:6px 0; }
  .frm input { height:26px; background:#141519; border:1px solid #3a3b45; border-radius:5px;
    color:#d5d6de; font-size:11.5px; padding:0 9px; outline:none; }
  .frm input:focus { border-color:#8a5cff; }
  .frm .btn { height:26px; border:none; border-radius:5px; background:#8a5cff; color:#fff;
    font-size:11.5px; cursor:pointer; }
  .frm .btn:hover { filter:brightness(1.1); }
  .msg { font-size:10.5px; color:#ff6b6b; min-height:14px; text-align:center; }
  .hint { font-size:10px; color:#4a4b55; text-align:center; margin-top:6px; line-height:1.6; }
  #list { max-height:200px; overflow:auto; }
  .it { padding:7px 8px; border-radius:6px; }
  .it:hover { background:#33343d; }
  .row1 { display:flex; align-items:center; gap:6px; }
  .site { flex:1; min-width:0; font-size:11.5px; color:#e8e9ef; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .acct { font-size:9.5px; color:#6a6b76; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; max-width:130px; }
  .pwd { font-family:Consolas,monospace; font-size:10.5px; color:#9a9ba6; user-select:text; }
  .acts { display:flex; gap:4px; margin-top:5px; }
  .acts button { flex:1; height:20px; border:1px solid #3a3b45; border-radius:4px;
    background:#141519; color:#9a9ba6; font-size:9.5px; cursor:pointer; }
  .acts button:hover { color:#fff; border-color:#8a5cff; }
  .add { display:none; flex-direction:column; gap:5px; margin-top:8px; padding-top:8px;
    border-top:1px solid #2c2d34; }
  .add.open { display:flex; }
  .add input { height:24px; background:#141519; border:1px solid #3a3b45; border-radius:5px;
    color:#d5d6de; font-size:11px; padding:0 8px; outline:none; }
  .add .row { display:flex; gap:5px; }
  .empty { color:#4a4b55; font-size:11px; text-align:center; padding:14px 0; }
  #tip { font-size:10px; color:#4a4b55; margin-top:8px; text-align:center; }
</style>
</head>
<body>
  <div id="panel">
    <div class="hd"><b>密码保险箱</b><span class="sp"></span><span id="hd-state"></span></div>

    <!-- 首次使用：设置主密码 -->
    <div id="v-setup" style="display:none">
      <div class="frm">
        <input id="s-p1" type="password" placeholder="设置主密码（至少 4 位）">
        <input id="s-p2" type="password" placeholder="再输入一次">
        <button class="btn" id="s-go">创建保险箱</button>
      </div>
      <div class="msg" id="s-msg"></div>
    </div>

    <!-- 解锁 -->
    <div id="v-lock" style="display:none">
      <div class="frm">
        <input id="l-pw" type="password" placeholder="输入主密码解锁">
        <button class="btn" id="l-go">解 锁</button>
      </div>
      <div class="msg" id="l-msg"></div>
    </div>

    <!-- 已解锁 -->
    <div id="v-open" style="display:none">
      <div id="list"></div>
      <div class="add" id="addbox">
        <div class="row"><input id="a-site" placeholder="网站 / 用途，如 github.com"></div>
        <div class="row"><input id="a-acct" placeholder="账号"></div>
        <div class="row"><input id="a-pwd" type="password" placeholder="密码"></div>
        <div class="row">
          <button class="mini" id="a-cancel" style="flex:1">取消</button>
          <button class="mini" id="a-save" style="flex:1.6;color:#8a5cff;border-color:#8a5cff">保存条目</button>
        </div>
      </div>
      <div class="acts" style="margin-top:8px">
        <button id="b-add">＋ 添加条目</button>
        <button id="b-lock">立即上锁</button>
      </div>
      <div id="tip">点击「复制密码 / 复制账号」后到目标处粘贴</div>
    </div>
  </div>

  <div id="strip" title="密码保险箱">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span id="dot"></span>
  </div>
<script>
(async () => {
  const panel = document.getElementById('panel');
  const dot = document.getElementById('dot');
  let expanded = false;
  let enc = '';        // 密文（config.data）
  let key = '';        // 当前会话主密码
  let entries = [];    // 解密后的条目
  const shown = {};    // idx -> 是否明文显示

  // ---------- 轻量加密：PIN 派生密钥 XOR + Base64（防君子不防黑客）----------
  function deriveKey(pin) {
    // 简单散列扩散，避免短密码直接循环的明显规律
    let h = 0x811c9dc5;
    for (let r = 0; r < 64; r++) {
      for (let i = 0; i < pin.length; i++) {
        h ^= pin.charCodeAt(i) + r;
        h = Math.imul(h, 0x01000193) >>> 0;
      }
    }
    const kb = [];
    for (let i = 0; i < 256; i++) {
      h ^= h << 13; h >>>= 0;
      h ^= h >> 17;
      h ^= h << 5;  h >>>= 0;
      kb.push(h & 0xff);
    }
    return kb;
  }
  function xorBytes(str, kb) {
    const u8 = new TextEncoder().encode(str);
    for (let i = 0; i < u8.length; i++) u8[i] ^= kb[i & 255];
    return u8;
  }
  function b64encode(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  }
  function b64decode(b) {
    const s = atob(b);
    const u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }
  function encrypt(obj, pin) {
    return b64encode(xorBytes(JSON.stringify(obj), deriveKey(pin)));
  }
  function decrypt(b64, pin) {
    const u8 = xorBytes(new TextDecoder().decode(b64decode(b64)), deriveKey(pin));
    return JSON.parse(new TextDecoder().decode(u8));
  }

  // ---------- 状态机 ----------
  const views = ['v-setup', 'v-lock', 'v-open'].map(id => document.getElementById(id));
  function show(name) {
    views.forEach(v => v.style.display = (v.id === name) ? 'block' : 'none');
    dot.classList.toggle('on', name === 'v-open');
    document.getElementById('hd-state').textContent =
      name === 'v-open' ? '已解锁' : (name === 'v-lock' ? '已上锁' : '');
  }

  async function loadData() {
    const cfg = await tbp.config();
    enc = typeof cfg.data === 'string' ? cfg.data : '';
    show(enc ? 'v-lock' : 'v-setup');
  }

  function msg(id, text) { document.getElementById(id).textContent = text || ''; }

  function render() {
    const list = document.getElementById('list');
    if (!entries.length) {
      list.innerHTML = '<div class="empty">保险箱是空的，点下方「＋ 添加条目」</div>';
      return;
    }
    list.innerHTML = '';
    entries.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'it';
      const row1 = document.createElement('div');
      row1.className = 'row1';
      const site = document.createElement('span');
      site.className = 'site'; site.textContent = it.site; site.title = it.site;
      const acct = document.createElement('span');
      acct.className = 'acct'; acct.textContent = it.acct; acct.title = it.acct;
      row1.append(site, acct);
      const row2 = document.createElement('div');
      row2.className = 'row1'; row2.style.marginTop = '3px';
      const pwd = document.createElement('span');
      pwd.className = 'pwd';
      pwd.textContent = shown[i] ? it.pwd : '••••••••';
      row2.append(pwd);
      const acts = document.createElement('div');
      acts.className = 'acts';
      const mk = (label, fn) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.onclick = (e) => { e.stopPropagation(); fn(b); };
        return b;
      };
      acts.append(
        mk(shown[i] ? '隐藏' : '显示', () => { shown[i] = !shown[i]; render(); }),
        mk('复制密码', async (b) => {
          await tbp.call('clipboard.set', { text: it.pwd });
          b.textContent = '已复制';
          setTimeout(() => { b.textContent = '复制密码'; }, 1200);
        }),
        mk('复制账号', async (b) => {
          await tbp.call('clipboard.set', { text: it.acct });
          b.textContent = '已复制';
          setTimeout(() => { b.textContent = '复制账号'; }, 1200);
        }),
        mk('删除', async () => {
          if (!confirm('删除「' + it.site + '」这条记录？')) return;
          entries.splice(i, 1);
          await persist();
          render();
        })
      );
      d.append(row1, row2, acts);
      list.appendChild(d);
    });
  }

  async function persist() {
    enc = encrypt(entries, key);
    await tbp.saveConfig({ data: enc });
  }

  // ---------- 事件 ----------
  document.getElementById('s-go').onclick = async () => {
    const p1 = document.getElementById('s-p1').value;
    const p2 = document.getElementById('s-p2').value;
    if (p1.length < 4) return msg('s-msg', '主密码至少 4 位');
    if (p1 !== p2) return msg('s-msg', '两次输入不一致');
    key = p1;
    entries = [];
    await persist();
    render();
    show('v-open');
  };
  document.getElementById('l-go').onclick = async () => {
    const pw = document.getElementById('l-pw').value;
    try {
      const arr = decrypt(enc, pw);
      if (!Array.isArray(arr)) throw new Error('bad');
      key = pw;
      entries = arr;
      for (const k in shown) delete shown[k];
      document.getElementById('l-pw').value = '';
      render();
      show('v-open');
    } catch (e) {
      msg('l-msg', '主密码不正确');
    }
  };
  document.getElementById('l-pw').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('l-go').click(); };

  document.getElementById('b-add').onclick = () => document.getElementById('addbox').classList.toggle('open');
  document.getElementById('a-cancel').onclick = () => document.getElementById('addbox').classList.remove('open');
  document.getElementById('a-save').onclick = async () => {
    const site = document.getElementById('a-site').value.trim();
    const acct = document.getElementById('a-acct').value.trim();
    const pwd = document.getElementById('a-pwd').value;
    if (!site || !acct || !pwd) return;
    entries.unshift({ site, acct, pwd });
    await persist();
    document.getElementById('a-site').value = '';
    document.getElementById('a-acct').value = '';
    document.getElementById('a-pwd').value = '';
    document.getElementById('addbox').classList.remove('open');
    render();
  };
  document.getElementById('b-lock').onclick = async () => {
    key = '';
    entries = [];
    for (const k in shown) delete shown[k];
    await loadData();
  };

  document.getElementById('strip').onclick = async () => {
    expanded = !expanded;
    panel.classList.toggle('open', expanded);
    if (expanded) {
      await loadData();
      if (!key) render();
    }
    await tbp.call(expanded ? 'dock.expand' : 'dock.collapse', { height: 360 });
  };
  tbp.on('dock.collapsed', async () => {
    expanded = false;
    panel.classList.remove('open');
    // 收起即上锁：清空内存中的明文
    key = '';
    entries = [];
    for (const k in shown) delete shown[k];
    await loadData();
  });

  await loadData();
  tbp.ready();
})();
</script>
</body>
</html>
